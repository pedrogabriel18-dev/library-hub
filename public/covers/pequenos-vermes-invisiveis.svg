<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fadfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="300" height="450" fill="url(#grad)" rx="12" />
  <rect x="15" y="15" width="270" height="420" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" rx="8" />
  
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="72" height="22" fill="rgba(255,255,255,0.25)" rx="11" />
    <text x="36" y="15" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">CIÊNCIAS</text>
  </g>
  
  <g transform="translate(30, 110)">
    <text x="0" y="30" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#ffffff" filter="url(#shadow)">Pequenos Vermes</text>
<text x="0" y="66" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#ffffff" filter="url(#shadow)">Invisíveis</text>

  </g>
  
  <g transform="translate(30, 360)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="rgba(255,255,255,0.95)" filter="url(#shadow)">Louis Pasteur</text>
    <line x1="0" y1="12" x2="80" y2="12" stroke="#ffffff" stroke-width="2" opacity="0.6" />
    <text x="0" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="1">ED. 2016</text>
  </g>
</svg>